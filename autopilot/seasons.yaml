# Theme calendar. Each theme is active from `lead_days` before its date until `after_days` after it.
# date: "MM-DD", "<first|second|third|fourth|last> <weekday> of <month>", "easter-21" (days from Easter Sunday),
#       or "us-election" (first Tuesday after the first Monday of November, even years).
# words: words that make an idea or song fit the theme. tone and cta go to the writer.

